name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet test tests/Hdr2Sdr.Core.Tests -c Release
      - run: dotnet publish src/Hdr2Sdr.App -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o dist/
      - run: dotnet publish src/Hdr2Sdr.Helper -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o dist/
      - uses: actions/upload-artifact@v4
        with:
          name: hdr2sdr
          path: |
            dist/hdr2sdr.exe
            dist/hdr2sdr-helper.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/hdr2sdr.exe
            dist/hdr2sdr-helper.exe

  builder-image:
    # Publishes the reproducible build environment (tools/builder.Dockerfile) to GHCR on every push to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: tools
          file: tools/builder.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/builder:latest
            ghcr.io/${{ github.repository }}/builder:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Build environment for hdr2sdr (.NET 9 SDK on Alpine)
            org.opencontainers.image.licenses=MIT
